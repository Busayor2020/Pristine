document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ize:14.5px;font-weight:600\">List row<\u002Fspan><span style=\"font-size:13.5px;color:#9BA3AE\">value<\u002Fspan><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" stroke=\"#4A525C\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 5l5 5-5 5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:12px;padding:15px\"><span style=\"flex:1;font-size:14.5px;font-weight:600\">Toggle row<\u002Fspan><span style=\"flex:none;width:48px;height:28px;border-radius:14px;background:#FF5A1F;position:relative;display:block\"><span style=\"position:absolute;top:3px;left:23px;width:22px;height:22px;border-radius:50%;background:#F3F5F7;display:block\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;border:1px solid #23272E;border-radius:14px;background:#121417;overflow:hidden\">\n            <div style=\"flex:1;padding:14px\"><div style=\"font-size:10.5px;font-weight:800;letter-spacing:0.1em;color:#7E8794;margin-bottom:9px\">BEFORE<\u002Fdiv><div style=\"font-size:17px;font-weight:700;color:#C6CCD4;font-variant-numeric:tabular-nums\">720 × 1280<\u002Fdiv><\u002Fdiv>\n            <div style=\"width:1px;background:#23272E\"><\u002Fdiv>\n            <div style=\"flex:1;padding:14px\"><div style=\"font-size:10.5px;font-weight:800;letter-spacing:0.1em;color:#FF5A1F;margin-bottom:9px\">AFTER<\u002Fdiv><div style=\"font-size:17px;font-weight:700;font-variant-numeric:tabular-nums\">1080 × 1920<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;align-items:center;gap:10px;padding:13px 15px;border:1px solid #23272E;border-radius:12px;background:#0E1013\">\n            <div style=\"font-size:12.5px;line-height:1.4;color:#9BA3AE;flex:1\">Upgrade slot — the honest limit, stated once<\u002Fdiv>\n            <span style=\"color:#FF5A1F;font-size:12.5px;font-weight:800;white-space:nowrap\">See plans<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #333941;border-radius:10px;background:#121417\">\n            <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" stroke=\"#9BA3AE\" stroke-width=\"1.7\" stroke-linecap=\"round\"><path d=\"M2 2l16 16\"><\u002Fpath><path d=\"M4.3 7.4A12 12 0 0 1 8 5.6\"><\u002Fpath><path d=\"M17.6 7.4a12 12 0 0 0-4.4-2.3\"><\u002Fpath><path d=\"M10 16.2h.01\"><\u002Fpath><\u002Fsvg>\n            <div style=\"font-size:12.5px;line-height:1.35;color:#9BA3AE\">System banner — no colour, just a hairline<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding:26px 32px;border:1px solid #1B1E23;border-radius:18px;background:#0A0B0D;display:grid;grid-template-columns:repeat(4,1fr);gap:32px\">\n      <div><div style=\"font-size:10.5px;font-weight:800;letter-spacing:0.16em;color:#FF5A1F;margin-bottom:10px\">WORDS WE USE<\u002Fdiv><div style=\"font-size:13px;line-height:1.6;color:#C6CCD4\">survives · holds up · stays sharp · prepared · far less to ruin<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-size:10.5px;font-weight:800;letter-spacing:0.16em;color:#7E8794;margin-bottom:10px\">WORDS WE NEVER USE<\u002Fdiv><div style=\"font-size:13px;line-height:1.6;color:#7E8794;text-decoration:line-through;text-decoration-color:#4A525C\">bypass · beat · no compression · original quality · uncompressed · lossless<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-size:10.5px;font-weight:800;letter-spacing:0.16em;color:#7E8794;margin-bottom:10px\">TOUCH<\u002Fdiv><div style=\"font-size:13px;line-height:1.6;color:#9BA3AE\">44px minimum on everything tappable. Primary action never above 560px from the top. Top third holds nothing you must reach.<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-size:10.5px;font-weight:800;letter-spacing:0.16em;color:#7E8794;margin-bottom:10px\">MOTION<\u002Fdiv><div style=\"font-size:13px;line-height:1.6;color:#9BA3AE\">Sheets rise 10px over 220ms. Buttons press to 0.985. Progress moves at the rate of real work. Nothing else animates.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ═════════════════ 1b PROTOTYPE ═════════════════ -->\n  <div id=\"1b\" style=\"display:flex;flex-direction:column;gap:32px\">\n    <div style=\"display:flex;align-items:baseline;gap:16px\">\n      <span style=\"font-size:11px;font-weight:800;letter-spacing:0.16em;color:#0A0B0D;background:#FF5A1F;padding:5px 9px;border-radius:5px\">1b<\u002Fspan>\n      <h2 style=\"margin:0;font-size:30px;font-weight:800;letter-spacing:-0.035em\">Prototype<\u002Fh2>\n      <span style=\"font-size:13.5px;color:#7E8794\">Both entry contexts, wired end to end. Start at first run, or jump into the result screen.<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:56px;align-items:flex-start\">\n      <div>\n        <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:14px\">\n          <span style=\"font-size:13px;font-weight:800\">Web PWA<\u002Fspan>\n          <span style=\"font-size:11.5px;color:#7E8794\">first run → file picker → preset → processing → result → export<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"width:414px;height:868px;border-radius:44px;background:#17191E;padding:12px;box-shadow:0 40px 80px rgba(0,0,0,.5)\">\n          <div style=\"width:390px;height:844px;border-radius:33px;overflow:hidden;background:#0A0B0D\">\n            <iframe src=\"{{ protoWeb }}\" title=\"Pristine web PWA prototype\" style=\"width:390px;height:844px;border:0;display:block\"><\u002Fiframe>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:14px\">\n          <span style=\"font-size:13px;font-weight:800\">Android<\u002Fspan>\n          <span style=\"font-size:11.5px;color:#7E8794\">permission priming → gallery multi-select → the same flow<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"width:414px;height:868px;border-radius:44px;background:#17191E;padding:12px;box-shadow:0 40px 80px rgba(0,0,0,.5)\">\n          <div style=\"width:390px;height:844px;border-radius:33px;overflow:hidden;background:#0A0B0D\">\n            <iframe src=\"{{ protoAndroid }}\" title=\"Pristine Android prototype\" style=\"width:390px;height:844px;border:0;display:block\"><\u002Fiframe>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"width:420px;padding:32px;border:1px solid #1B1E23;border-radius:18px;background:#0A0B0D\">\n        <div style=\"font-size:10.5px;font-weight:800;letter-spacing:0.16em;color:#7E8794;margin-bottom:20px\">THE ONE RISKY MOMENT<\u002Fdiv>\n        <div style=\"font-size:20px;line-height:1.25;font-weight:800;letter-spacing:-0.03em;margin-bottom:14px;text-wrap:pretty\">A user hands over a photo and gets back a video. If that reads as a bug, they uninstall.<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.6;color:#9BA3AE;margin-bottom:22px;text-wrap:pretty\">So it's said twice, in full, before it can surprise anyone — a numbered card on first run, and a permanent explainer sitting under the result, not behind a tooltip. Both use the same three sentences, so the second reading confirms the first rather than adding new information.<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px;padding-top:22px;border-top:1px solid #1B1E23\">\n          <div style=\"display:flex;gap:12px\"><span style=\"font-size:11px;font-weight:800;color:#FF5A1F;width:20px;flex:none;font-variant-numeric:tabular-nums\">01<\u002Fspan><span style=\"font-size:12.5px;line-height:1.5;color:#7E8794\">Two pipelines — one for pictures, one for video.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px\"><span style=\"font-size:11px;font-weight:800;color:#FF5A1F;width:20px;flex:none;font-variant-numeric:tabular-nums\">02<\u002Fspan><span style=\"font-size:12.5px;line-height:1.5;color:#7E8794\">The video one is gentler with detail, so the photo becomes a short clip.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px\"><span style=\"font-size:11px;font-weight:800;color:#FF5A1F;width:20px;flex:none;font-variant-numeric:tabular-nums\">03<\u002Fspan><span style=\"font-size:12.5px;line-height:1.5;color:#7E8794\">Viewers still see a photo post. Nobody can tell.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:26px;padding-top:22px;border-top:1px solid #1B1E23;font-size:12.5px;line-height:1.6;color:#7E8794;text-wrap:pretty\">The web build never mocks a gallery it can't open. It says the browser hands over one file at a time, and puts the install prompt where the missing capability actually bites — not as a banner on every screen.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ═════════════════ 1c SCREENS ═════════════════ -->\n  <div id=\"1c\" style=\"display:flex;flex-direction:column;gap:32px\">\n    <div style=\"display:flex;align-items:baseline;gap:16px\">\n      <span style=\"font-size:11px;font-weight:800;letter-spacing:0.16em;color:#0A0B0D;background:#FF5A1F;padding:5px 9px;border-radius:5px\">1c<\u002Fspan>\n      <h2 style=\"margin:0;font-size:30px;font-weight:800;letter-spacing:-0.035em\">Screens<\u002Fh2>\n      <span style=\"font-size:13.5px;color:#7E8794\">Every frame is live — drag the comparison, drag the split handles, switch presets.<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(6,390px);gap:40px 32px\">\n      <sc-for list=\"{{ board }}\" as=\"b\" hint-placeholder-count=\"16\">\n        <div data-screen-label=\"{{ b.label }}\">\n          <div style=\"display:flex;align-items:baseline;gap:9px;margin-bottom:12px;height:36px\">\n            <span style=\"font-size:11px;font-weight:800;color:#FF5A1F;font-variant-numeric:tabular-nums\">{{ b.num }}<\u002Fspan>\n            <span style=\"font-size:14px;font-weight:800;letter-spacing:-0.02em\">{{ b.label }}<\u002Fspan>\n            <span style=\"font-size:11px;color:#7E8794;margin-left:auto;text-align:right;line-height:1.3\">{{ b.note }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"width:390px;height:844px;border-radius:18px;overflow:hidden;border:1px solid #1B1E23\">\n            <iframe src=\"{{ b.src }}\" title=\"{{ b.label }}\" loading=\"lazy\" style=\"width:390px;height:844px;border:0;display:block\"><\u002Fiframe>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ═════════════════ 1d STATES ═════════════════ -->\n  <div id=\"1d\" style=\"display:flex;flex-direction:column;gap:32px\">\n    <div style=\"display:flex;align-items:baseline;gap:16px\">\n      <span style=\"font-size:11px;font-weight:800;letter-spacing:0.16em;color:#0A0B0D;background:#FF5A1F;padding:5px 9px;border-radius:5px\">1d<\u002Fspan>\n      <h2 style=\"margin:0;font-size:30px;font-weight:800;letter-spacing:-0.035em\">States &amp; seller mode<\u002Fh2>\n      <span style=\"font-size:13.5px;color:#7E8794\">Every failure names the cause and offers the cheapest way out first.<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(6,390px);gap:40px 32px\">\n      <sc-for list=\"{{ stateBoard }}\" as=\"b\" hint-placeholder-count=\"8\">\n        <div data-screen-label=\"{{ b.label }}\">\n          <div style=\"display:flex;align-items:baseline;gap:9px;margin-bottom:12px;height:36px\">\n            <span style=\"font-size:14px;font-weight:800;letter-spacing:-0.02em\">{{ b.label }}<\u002Fspan>\n            <span style=\"font-size:11px;color:#7E8794;margin-left:auto;text-align:right;line-height:1.3\">{{ b.note }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"width:390px;height:844px;border-radius:18px;overflow:hidden;border:1px solid #1B1E23\">\n            <iframe src=\"{{ b.src }}\" title=\"{{ b.label }}\" loading=\"lazy\" style=\"width:390px;height:844px;border:0;display:block\"><\u002Fiframe>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"padding:30px 32px;border:1px solid #1B1E23;border-radius:18px;background:#0A0B0D;display:grid;grid-template-columns:1fr 1fr 1fr;gap:40px\">\n      <div>\n        <div style=\"font-size:10.5px;font-weight:800;letter-spacing:0.16em;color:#FF5A1F;margin-bottom:12px\">WHERE MONEY WILL SIT<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.65;color:#9BA3AE;text-wrap:pretty\">Three slots, drawn now, empty until you want them: the Max Quality row on the preset screen, the third part on the split screen, and the whole of seller mode. Each is one quiet line plus a \"See plans\" link on a surface that already exists — so switching them on moves nothing.<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:10.5px;font-weight:800;letter-spacing:0.16em;color:#7E8794;margin-bottom:12px\">DOES SELLER MODE DILUTE V1?<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.65;color:#9BA3AE;text-wrap:pretty\">Batch doesn't — it's the preset screen and the processing screen with a list, no new vocabulary, and it stays behind a door the everyday poster never opens. Brand kit does. Logo placement, sizing and price templates are a small design tool bolted to a media utility, and it's the only screen here that needs a paragraph. My recommendation: ship batch in v1, hold brand kit until sellers ask for it by name.<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:10.5px;font-weight:800;letter-spacing:0.16em;color:#7E8794;margin-bottom:12px\">HANDOFF SHAPE<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.65;color:#9BA3AE;text-wrap:pretty\">One component owns the app shell and routes by screen; every frame above is the same component at a different starting point, which is why the board and the prototype can't drift apart. Screens compose from the eleven components in 1a — no frame introduces a one-off control.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nclass Component extends DCLogic {\n  src(screen, build, flag){\n    var base = (typeof window !== 'undefined' && window.__resources && window.__resources.app) ? window.__resources.app : 'PristineApp.dc.html';\n    var sep = base.slice(0,5) === 'blob:' ? '#' : '?';\n    return base + sep + 's=' + screen + '&b=' + build + (flag && flag !== 'none' ? '&f=' + flag : '');\n  }\n  renderVals(){\n    const withSrc = r => r.map(b => ({ ...b, src: this.src(b.screen, b.build, b.flag) }));\n    return {\n      protoWeb: this.src('first-run','web'),\n      protoAndroid: this.src('first-run','android'),\n      inks: [\n        {name:'ink / ground', hex:'#0A0B0D', use:'app background'},\n        {name:'ink / recess', hex:'#0E1013', use:'inset panels'},\n        {name:'ink / surface', hex:'#121417', use:'cards, sheets'},\n        {name:'ink / raised', hex:'#191C21', use:'raised control'},\n        {name:'line', hex:'#23272E', use:'hairline'},\n        {name:'line / strong', hex:'#333941', use:'button border'},\n        {name:'text / dim', hex:'#7E8794', use:'captions, timestamps'},\n        {name:'text / body', hex:'#9BA3AE', use:'secondary copy'},\n        {name:'text / high', hex:'#F3F5F7', use:'headings, values'}\n      ],\n      accents: [\n        {name:'flare', hex:'#FF5A1F', use:'primary action, Pristine side'},\n        {name:'flare / press', hex:'#EF4E14', use:'pressed state only'},\n        {name:'flare / ground', hex:'#1C1109', use:'selected option card'}\n      ],\n      spaces: [4,8,12,16,20,24,32,40,56].map(v=>({v})),\n      radii: [4,6,10,12,14,20].map(v=>({v})),\n      board: withSrc([\n        {num:'01', label:'Result', screen:'result', build:'web', note:'the screen that sells it'},\n        {num:'02', label:'First run', screen:'first-run', build:'web', note:'proof above the fold'},\n        {num:'02', label:'Education card', screen:'edu', build:'web', note:'one time, dismissible'},\n        {num:'03', label:'Entry — web, empty', screen:'entry-web-empty', build:'web', note:'no gallery, honestly'},\n        {num:'03', label:'Entry — web, chosen', screen:'entry-web', build:'web', note:'landscape suggestion'},\n        {num:'03', label:'Entry — Android', screen:'gallery', build:'android', note:'multi-select'},\n        {num:'04', label:'Preset', screen:'preset', build:'web', note:'the trade, in the open'},\n        {num:'05', label:'Processing', screen:'processing', build:'web', note:'named stages'},\n        {num:'06', label:'Export', screen:'export', build:'web', note:'three real outcomes'},\n        {num:'07', label:'Long video split', screen:'split', build:'web', note:'drag the cut points'},\n        {num:'08', label:'Library', screen:'library', build:'web', note:'storage first'},\n        {num:'08', label:'Library — empty', screen:'library-empty', build:'web', note:'first run'},\n        {num:'09', label:'Permission priming', screen:'permission', build:'android', note:'before the OS asks'},\n        {num:'10', label:'Settings', screen:'settings', build:'web', note:'language switcher'},\n        {num:'11', label:'Batch — seller', screen:'batch', build:'android', note:'phase 2'},\n        {num:'12', label:'Brand kit — seller', screen:'brandkit', build:'android', note:'phase 2'}\n      ]),\n      stateBoard: withSrc([\n        {label:'Offline', screen:'result', build:'web', flag:'offline', note:'prepare now, post later'},\n        {label:'Processing failed', screen:'processing', build:'web', flag:'failed', note:'cause + cheapest fix'},\n        {label:'File too large', screen:'entry-web', build:'web', flag:'too-large', note:'routes to split'},\n        {label:'Unsupported format', screen:'entry-web-empty', build:'web', flag:'unsupported', note:'.HEIC in browser'},\n        {label:'Low device storage', screen:'preset', build:'web', flag:'low-storage', note:'exact numbers'},\n        {label:'Android-only feature', screen:'entry-web-empty', build:'web', flag:'android-only', note:'tasteful install'},\n        {label:'Free-plan limit', screen:'split', build:'web', flag:'none', note:'3 parts, free does 2'},\n        {label:'Upgrade slot', screen:'preset', build:'web', flag:'none', note:'tap Max Quality'}\n      ])\n    };\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
