packages:
  - 'apps/*'
  - 'packages/*'
  - 'experiments'
# esbuild resolves its platform binary in a postinstall. Vite and Vitest both
# need it, so the script is allowed to run.
allowBuilds:
  esbuild: true
  # ffmpeg-static downloads its platform binary in a postinstall. Used only by
  # the experiments harness, never shipped in an app bundle.
  ffmpeg-static: true
